<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>HIDDENMACHINE — station HMΔ</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="-5%" r="122%">
      <stop offset="0%" stop-color="#0e1319"/>
      <stop offset="55%" stop-color="#060a0e"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="115%">
      <stop offset="52%" stop-color="#010203" stop-opacity="0"/>
      <stop offset="100%" stop-color="#010203" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="scanband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#69bac3" stop-opacity="0"/>
      <stop offset="45%" stop-color="#69bac3" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#69bac3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#69bac3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="none"/>
      <rect y="2" width="4" height="1" fill="#000000" opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- ===== header ===== -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
    <circle cx="64" cy="46" r="4" fill="#69bac3" filter="url(#glow)"/>
    <text x="79" y="50" fill="#d8dfe4" font-weight="500" letter-spacing="4">HIDDENMACHINE</text>
    <text x="253" y="50" fill="#4d5359" letter-spacing="2">// STATION HMΔ</text>
    <text x="1150" y="50" fill="#6e767c" letter-spacing="1.5">FREQ 4.625&#8202;MHZ</text>
    <text x="1301" y="50" fill="#8b939a" letter-spacing="1.5">04:12:16 UTC</text>
    <g>
      <rect x="1436" y="34" width="104" height="25" rx="2" fill="none" stroke="#33393e" stroke-width="1"/>
      <circle cx="1450" cy="46.5" r="3" fill="#69bac3"/>
      <text x="1460" y="50" fill="#97a0a7" letter-spacing="1.5">AUDIO ON</text>
    </g>
    <line x1="60" y1="61" x2="1540" y2="61" stroke="#292f34" stroke-opacity="0.7" stroke-width="1"/>
  </g>

  <!-- ===== middle column (max-width 860, centred) ===== -->
  <!-- IN row -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="370" y="295" fill="#b99056" font-size="11" letter-spacing="2">&#9666; IN</text>
    <text x="424" y="295" fill="#6e6150" fill-opacity="0.85" font-size="15" font-weight="200" letter-spacing="0.5">no, ▓▓▓ ▓▓▓▓ one</text>
  </g>

  <!-- OUT block -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="370" y="340" fill="#5cadb6" font-size="11" letter-spacing="2">&#9656; OUT &#8226; RESPONSE</text>
    <text x="370" y="396" fill="#e0e5e9" font-size="42" font-weight="300" letter-spacing="0.2">No — the other one. The blue one.</text>
    <text x="370" y="455.6" fill="#e0e5e9" font-size="42" font-weight="300" letter-spacing="0.2">You know the one.</text>
    <!-- decode cursor: 0.55em x 1em of the 42px type, frozen visible -->
    <rect x="811" y="421" width="23.1" height="42" fill="#50bdc9" filter="url(#glow)"/>
  </g>

  <!-- meta row -->
  <g font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="1.6">
    <text x="370" y="513" fill="#5d646b">MOTIF &#8226; <tspan fill="#80aeb3">THE-BLUE-ONE</tspan></text>
    <text x="605" y="513" fill="#5d646b">PKT 7F3A</text>
    <text x="737" y="513" fill="#5d646b">SNR 11.4&#8202;DB</text>
    <text x="898" y="513" fill="#5d646b">DECODE <tspan fill="#8b939a">100%</tspan></text>
  </g>

